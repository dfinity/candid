name: Tools

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - 'rust/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/tools.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always # Force Cargo to use colors
  TERM: xterm-256color
  WORKING_DIR: tools/didc-js

# Neither job is a required status check, so a workflow-level `paths:` filter is
# safe here. See rust.yml for why the required check cannot use one.

jobs:
  build-didc:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove pre-installed Rust stable toolchain
        run: rustup toolchain remove stable 2>/dev/null || true
      # No explicit `toolchain` — uses the channel from rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
      - name: Build didc
        run: cargo build -p didc --release

  build-and-test-didc-js:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # TODO: use dfinity/ci-tools/actions/setup-pnpm once the repo has a standard structure with a package.json file in the root
      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          package_json_file: ${{ env.WORKING_DIR }}/package.json

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ env.WORKING_DIR }}/.node-version
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: ${{ env.WORKING_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm i --frozen-lockfile
      # end of TODO

      - name: Build didc-js
        run: pnpm build

      - name: Test didc-js
        run: pnpm test
