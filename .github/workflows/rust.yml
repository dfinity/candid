name: Rust

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always # Force Cargo to use colors
  TERM: xterm-256color

# `rust` is a required status check. Do NOT add a workflow-level `paths:` filter:
# when it does not match, no check run is created at all and branch protection
# blocks the PR forever. Gate with the `changes` job below instead — a skipped job
# does report as passing.

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    outputs:
      # Empty outside `pull_request` (filter step skipped) => 'true', run everything.
      rust: ${{ steps.filter.outputs.rust || 'true' }}
    steps:
      # paths-filter reads the changed files from the API; no checkout needed.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'tools/**'
              - 'test/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/workflows/rust.yml'

  rust:
    name: rust
    needs: changes
    # Also runs when detection failed: a broken `changes` job must not silently
    # green-light the required check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The image's bundled stable varies by image release and would make the
      # rust-cache key non-deterministic.
      - name: Remove pre-installed Rust stable toolchain
        run: rustup toolchain remove stable 2>/dev/null || true
      # No explicit `toolchain` — uses the channel from rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
      - name: Build
        run: cargo build
      - name: Run tests
        run: |
          cargo test --no-default-features -- --color always
          cargo test -- --color always
          cargo test --features all -- --color always
      - name: fmt
        run: cargo fmt -v -- --check
      - name: lint
        run: cargo clippy --features all --tests -- -D warnings
      - name: doc
        run: cargo doc

  fuzzing:
    name: fuzzing
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The image's bundled stable varies by image release and would make the
      # rust-cache key non-deterministic.
      - name: Remove pre-installed Rust stable toolchain
        run: rustup toolchain remove stable 2>/dev/null || true
      # rust-toolchain.toml pins this directory to stable, so the build below
      # still needs an explicit `+nightly` even with nightly installed.
      - name: Install Rust nightly toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@80e6af7a2ec7f280fffe2d0a9d3a12a9d11d86e9 # v2.75.1
        with:
          tool: cargo-fuzz
      - name: Build fuzzers
        working-directory: rust/candid
        run: cargo +nightly fuzz build
