name: Rust

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always # Force Cargo to use colors
  TERM: xterm-256color

# `rust` is the only required status check on `master`, which constrains how this
# workflow may be gated.
#
# A workflow-level `paths:` filter must NOT be used here: when the filter does not
# match, the workflow never starts, no check run is created, and branch protection
# waits for a `rust` check that will never arrive. The PR is then unmergeable.
#
# Instead, the workflow always starts and the `changes` job decides. Gated jobs are
# *skipped*, and GitHub reports a skipped job as passing for required checks. If
# detection itself fails, the gate falls open and the jobs run — the safe direction.
#
# All Rust jobs use `actions-rust-lang/setup-rust-toolchain`, which installs the
# toolchain and handles Rust caching (via Swatinem/rust-cache) internally, keyed
# per job. No separate `actions/cache` step is needed. Each such job first removes
# the runner image's pre-installed stable toolchain, whose version varies between
# image releases and would otherwise make the cache hash non-deterministic.

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    outputs:
      # Empty on non-`pull_request` events (the filter step is skipped), which the
      # `|| 'true'` turns into "run everything". On a pull request the filter emits
      # the literal 'true'/'false', and a non-empty string wins the `||`.
      rust: ${{ steps.filter.outputs.rust || 'true' }}
    steps:
      # No checkout: for `pull_request` events paths-filter reads the changed file
      # list from the GitHub API.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'tools/**'
              - 'test/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/workflows/rust.yml'

  rust:
    name: rust
    needs: changes
    # Run when Rust-relevant paths changed, and also whenever detection did not
    # complete successfully — a broken `changes` job must not silently green-light
    # the required check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove pre-installed Rust stable toolchain
        run: rustup toolchain remove stable 2>/dev/null || true
      # No explicit `toolchain` — uses the channel from rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
      - name: Build
        run: cargo build
      - name: Run tests
        run: |
          cargo test --no-default-features -- --color always
          cargo test -- --color always
          cargo test --features all -- --color always
      - name: fmt
        run: cargo fmt -v -- --check
      - name: lint
        run: cargo clippy --features all --tests -- -D warnings
      - name: doc
        run: cargo doc

  fuzzing:
    name: fuzzing
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove pre-installed Rust stable toolchain
        run: rustup toolchain remove stable 2>/dev/null || true
      # cargo-fuzz requires nightly. rust-toolchain.toml pins the directory to
      # stable, so the build below still needs an explicit `+nightly`.
      - name: Install Rust nightly toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@80e6af7a2ec7f280fffe2d0a9d3a12a9d11d86e9 # v2.75.1
        with:
          tool: cargo-fuzz
      - name: Build fuzzers
        working-directory: rust/candid
        run: cargo +nightly fuzz build
