name: Rust Bench

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/bench.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow builds and runs benchmark code from the pull request, so it must
# never hold a writable token. Pull requests from forks get a read-only
# `GITHUB_TOKEN` regardless of what is declared here, which is why posting the
# result comment from this job failed on every fork PR (#755: "Resource not
# accessible by integration"). The comment is posted by bench-comment.yml
# instead, which runs on `workflow_run` in the base repository context.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always # Force Cargo to use colors
  TERM: xterm-256color
  CANBENCH_VERSION: 0.2.0

jobs:
  runBenchMark:
    name: run benchmark
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Checkout base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.base_ref }}
          path: main/
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Remove pre-installed Rust stable toolchain
        run: rustup toolchain remove stable 2>/dev/null || true
      # No explicit `toolchain` — uses the channel from rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          # rust-cache keys on the workspace, but the bench crate has its own
          # lockfile and target dir; include it so both are cached together.
          cache-workspaces: |
            .
            rust/bench
          # Cache ~/.cargo/bin separately below instead: rust-cache's key includes
          # the Cargo.lock hash, so canbench would be rebuilt from source every
          # time a dependency moves, even though its own version never changed.
          cache-bin: false
      - name: Cache canbench
        id: canbench-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/canbench
          key: ${{ runner.os }}-canbench-${{ env.CANBENCH_VERSION }}
      - name: Install canbench
        if: steps.canbench-cache.outputs.cache-hit != 'true'
        run: cargo install --version ${{ env.CANBENCH_VERSION }} --locked canbench
      - name: Run perf for base branch
        run: |
          pushd main/rust/bench
          canbench --show-summary --persist
          popd
          cp main/rust/bench/canbench_results.yml rust/bench/
      - name: Run perf for PR branch
        run: |
          pushd rust/bench
          canbench --less-verbose --show-summary --persist > /tmp/perf.txt
          python diff.py canbench_results.yml ../../main/rust/bench/canbench_results.yml > /tmp/table.md
          {
            cat /tmp/table.md
            echo "<details><summary>Click to see raw report</summary>"
            echo
            echo "\`\`\`"
            cat /tmp/perf.txt
            echo "\`\`\`"
            echo "</details>"
          } > /tmp/message.txt
      # The PR number is carried in the artifact because
      # `github.event.workflow_run.pull_requests` is empty for fork pull requests.
      - name: Collect comment payload
        run: |
          mkdir -p /tmp/bench-comment
          cp /tmp/message.txt /tmp/bench-comment/message.txt
          echo "${{ github.event.pull_request.number }}" > /tmp/bench-comment/pr-number.txt
      - name: Upload comment payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-comment
          path: /tmp/bench-comment/
          retention-days: 1
