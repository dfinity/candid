name: Lean

on:
  push:
    branches:
      - master
      - rewrite
    paths:
      - 'lean/**'
      - 'conformance/vectors/**'
      - 'crates/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'lean/**'
      - 'conformance/vectors/**'
      - 'crates/**'
      - '.github/workflows/lean.yml'

# Not a required status check. If it becomes one, the workflow-level `paths:` filter
# above has to go and be replaced with the job-level `dorny/paths-filter` pattern
# used by `rust.yml` -- see the comment at the top of that file for why.

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Installs the toolchain named in `lean/lean-toolchain` and caches the build.
      # `lake test` runs the same binary (see `testDriver` in `lean/lakefile.toml`);
      # the explicit step below is kept so the check names appear in the log.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          build: true
          test: false
          use-mathlib-cache: false

      # The model checks itself and exits nonzero on any disagreement, so this step
      # is the one that makes the job mean something.
      - name: run the reference model
        working-directory: lean
        run: lake exe oracle

      # The committed vectors are the model's output. Writing them again must change
      # nothing: a change to the model lands together with the answers it changed.
      - name: conformance vectors are up to date
        working-directory: lean
        run: |
          lake exe oracle write ../conformance/vectors
          git diff --exit-code -- ../conformance/vectors
          test -z "$(git status --porcelain -- ../conformance/vectors)"

      # Read back as any other runner reads them, rather than as the model wrote them.
      - name: conformance vectors agree with the model
        working-directory: lean
        run: lake exe oracle check ../conformance/vectors/*.json

      # The differential corpus `candid_binary` is tested against is the model's output
      # too, from a fixed seed.
      - name: differential corpus is up to date
        working-directory: lean
        run: |
          lake exe oracle differential ../crates/conformance_tests/tests/differential.json
          git diff --exit-code -- ../crates/conformance_tests/tests/differential.json

  # `candid_binary` held to the model on far more messages than are committed, from a
  # seed that changes with every run: fuzzing, with the model as the judge. A failure
  # is a disagreement between the two, and the log names the seed that reproduces it
  # (`crates/conformance_tests/tests/differential.rs`).
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          build: true
          test: false
          use-mathlib-cache: false
      # See `crates.yml`: the image's bundled stable would make the cache key vary.
      - name: Remove pre-installed Rust stable toolchain
        run: rustup toolchain remove stable 2>/dev/null || true
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          cache-workspaces: crates
      - name: write cases
        working-directory: lean
        run: |
          echo "seed $GITHUB_RUN_ID"
          lake exe oracle differential "$RUNNER_TEMP/cases.json" "$GITHUB_RUN_ID" 40000
      - name: candid_binary agrees with the model
        run: cargo test --locked --manifest-path crates/Cargo.toml -p conformance_tests --test differential
        env:
          CANDID_DIFFERENTIAL: ${{ runner.temp }}/cases.json
