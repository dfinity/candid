# Its own workspace, not a member of the root one: `[patch.crates-io]` below is
# only honored in a workspace root, and it is needed so that ic-cdk's and
# canbench-rs' transitive `candid` resolves to this repo rather than crates.io.
[workspace]

# Mirrors the root workspace's policy so local runs match CI.
[workspace.lints.clippy]
all = { level = "deny", priority = 0 }
uninlined_format_args = { level = "allow", priority = 1 }

[package]
name = "bench"
edition = "2021"

[lints]
workspace = true

[[bin]]
name = "bench"
path = "bench.rs"

[dependencies]
candid = { path = "../candid", features = ["value"] }
candid_parser = { path = "../candid_parser" }
canbench-rs = "0.2.0"
ic-cdk = "0.17"
serde = "1.0"
serde_bytes = "0.11"
hex = "0.4.3"

[patch.crates-io]
candid = { path = "../candid" }
candid_derive = { path = "../candid_derive" }
ic_principal = { path = "../ic_principal" }
